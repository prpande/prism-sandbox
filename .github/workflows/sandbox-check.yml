name: sandbox-check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when the branch carries a FAIL marker
        run: |
          if [ -f FAIL ]; then
            echo "FAIL marker present: $(cat FAIL)"
            exit 1
          fi
          echo "no marker, check passes"
