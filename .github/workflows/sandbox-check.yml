name: sandbox-check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore packages
        run: |
          if [ -f FAIL ]; then
            echo "curl: (56) Recv failure: ECONNRESET"
            echo "error NU1301: Unable to load the service index for source https://api.nuget.org/v3/index.json"
            exit 1
          fi
          echo "no marker, check passes"
